apiVersion: v1
kind: Namespace
metadata:
  name: comfyui
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: comfyui-sts
  namespace: comfyui
spec:
  updateStrategy:
    type: OnDelete
  serviceName: comfyui-service
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      # 调度到带 GPU 的节点。
      nodeSelector:
        kubernetes.io/hostname: "prod-m1"
      # 使用 containerd 中配置的 NVIDIA 运行时。
      runtimeClassName: nvidia
      initContainers:
      - name: install-custom-node-dependencies
        image: yanwk/comfyui-boot:cu126-slim-20260223
        command:
        - /bin/sh
        - -c
        - >-
          python3 -m pip install --user
          -r /root/ComfyUI/custom_nodes/dll-comfyui-node/requirements.txt
        volumeMounts:
        - name: storage
          mountPath: /root
        - name: python-site-packages
          mountPath: /root/.local/lib/python3.12/site-packages
      containers:
      - name: comfyui
        # image: yanwk/comfyui-boot:cu128-megapak-20260221
        image: yanwk/comfyui-boot:cu126-slim-20260223
        ports:
        - containerPort: 8188
        env:
        # 禁用 xformers，使用标准 PyTorch 实现。
        - name: CLI_ARGS
          value: "--listen 0.0.0.0 --disable-xformers"
        - name: CM_OFFLINE_MODE
          value: "1"
        resources:
          limits:
            nvidia.com/gpu: 1
            # nvidia.com/gpumem: 4000
            # nvidia.com/gpucores: 50
        volumeMounts:
        - name: storage
          mountPath: /root
        - name: models
          mountPath: /root/ComfyUI/models
        - name: hf-hub
          mountPath: /root/.cache/huggingface/hub
        - name: torch-hub
          mountPath: /root/.cache/torch/hub
        - name: input
          mountPath: /root/ComfyUI/input
        - name: output
          mountPath: /root/ComfyUI/output
        - name: workflows
          mountPath: /root/ComfyUI/user/default/workflows
        - name: python-site-packages
          mountPath: /root/.local/lib/python3.12/site-packages
      volumes:
      - name: storage
        hostPath:
          path: /data/comfyui/storage
      - name: models
        hostPath:
          path: /data/comfyui/storage-models/models
      - name: hf-hub
        hostPath:
          path: /data/comfyui/storage-models/hf-hub
      - name: torch-hub
        hostPath:
          path: /data/comfyui/storage-models/torch-hub
      - name: workflows
        hostPath:
          path: /data/comfyui/storage-user/workflows
      - name: python-site-packages
        hostPath:
          path: /data/comfyui/python-site-packages
          type: Directory
  # input/output 使用 NFS StorageClass 动态创建 PVC。
  volumeClaimTemplates:
  - metadata:
      name: input
      annotations:
        nfs.io/storage-path: comfyui-input
    spec:
      accessModes: ["ReadWriteMany"]
      storageClassName: annotations-path-retain
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: output
      annotations:
        nfs.io/storage-path: comfyui-output
    spec:
      accessModes: ["ReadWriteMany"]
      storageClassName: annotations-path-retain
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-service
  namespace: comfyui
spec:
  type: NodePort
  selector:
    app: comfyui
  ports:
  - protocol: TCP
    port: 8188
    targetPort: 8188
    nodePort: 30188
